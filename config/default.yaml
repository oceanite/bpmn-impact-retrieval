# All tunable parameters live here.

paths:
  target_repo: data/target_repo
  scenarios: data/bpmn/scenarios
  ground_truth: data/ground_truth/ground_truth.csv

code_extraction:
  # Simple-ERP: Go backend, Next.js/TypeScript frontend, SQL migrations, OpenAPI spec
  include_extensions: [".go", ".ts", ".tsx", ".sql", ".yaml", ".yml", ".json"]
  # docs/ holds Simple-ERP's own BPMN models — indexing them would leak the query into the corpus
  exclude_dirs: [".git", ".github", "node_modules", ".next", "dist", "build", "public", "docs"]
  exclude_files: ["package-lock.json", "go.sum"]
  openapi_spec: api/openapi.yaml   # source for API route fields
  # Any file with one of these names is also read as an OpenAPI spec (for uploaded repos)
  openapi_filenames: [openapi.yaml, openapi.yml, swagger.yaml, swagger.yml]

upload:                     # limits for files uploaded on the website
  max_bpmn_mb: 5
  max_zip_mb: 50            # compressed size of a source-code ZIP
  max_unzipped_mb: 200      # total size after extraction (zip-bomb guard)
  max_files: 20000

preprocessing:
  split_identifiers: true   # camelCase / snake_case
  lowercase: true
  remove_stopwords: true    # English list (scikit-learn) + the lists below
  stemming: porter          # porter | none
  min_token_length: 2
  # Words that appear in almost every source file and carry no business meaning
  code_stopwords: [func, return, err, nil, ctx, context, string, int, bool, error, var, const,
                   type, struct, interface, package, import, if, else, for, range, defer, go,
                   tx, "true", "false", "null", undefined, async, await, export, default, let,
                   new, http, json, api, internal, adapter, backend, frontend, src, ts, tsx,
                   app, features, lib, fmt, errors, len, make, append, map, chi, pgx,
                   use, div, span, props]
  # Words that appear in almost every BPMN model
  bpmn_stopwords: [task, process, start, end, event, gateway, flow, lane, level, completed,
                   requested, identified, ready, merge]
  # Indonesian stopwords (conjunctions, prepositions, particles, common flow terms)
  indonesian_stopwords: [dan, atau, serta, tetapi, tapi, melainkan, sedangkan, namun,
                         karena, sebab, sehingga, agar, supaya, jika, kalau, bila, apabila,
                         walaupun, meskipun, bahwa, setelah, sesudah, sebelum, ketika, saat,
                         lalu, kemudian, di, ke, dari, pada, dalam, untuk, bagi, kepada, oleh,
                         dengan, tentang, tanpa, antara, hingga, sampai, atas, bawah, ini,
                         itu, yang, ada, adalah, ialah, tersebut, suatu, para, setiap, masing,
                         per, pun, apa, apakah, bagaimana, kapan, mana, siapa, mengapa, kenapa,
                         bisa, dapat, akan, telah, sudah, belum, tidak, bukan, alur, tahap,
                         langkah, proses, kegiatan, mulai, selesai, aksi, hasil, diterima]
  # Domain synonyms: every variant is replaced by the canonical word (key) on BOTH sides
  # (query and code), so "bill" in a BPMN label meets "Invoice" in code (mapping runs before
  # stopwords, which matters: "bill" is in the English stopword list). Off by default
  # so the baseline numbers stay the same.
  use_synonyms: false
  synonyms:
    invoice: [bill, billing]
    confirm: [confirmation, confirmed]
    approve: [review, approval, approved]
    supplier: [vendor]
    customer: [client]
  # Indonesian -> English business terms (for Indonesian models such as Simple-ERP docs/bpm-haqi).
  # Applied before stopwords and stemming; a value may hold several English words. Off by default.
  use_translation: false
  id_en_terms:
    pengguna: user
    penjualan: sales
    pembelian: purchase
    stok: inventory
    persediaan: inventory
    pesanan: order
    pemesanan: order
    pemasok: supplier
    pelanggan: customer
    barang: goods
    gudang: warehouse
    faktur: invoice
    tagihan: invoice
    pembayaran: payment
    bayar: pay
    penerimaan: receipt
    pengiriman: delivery
    permintaan: request
    pengadaan: procurement
    keuangan: finance
    penyesuaian: adjustment
    utang: payable
    hutang: payable
    piutang: receivable
    laporan: report
    pengaturan: settings
    sesi: session
    akses: access
    undangan: invitation
    sandi: password
    harga: price
    jumlah: quantity
    saldo: balance
    dokumen: document
    transaksi: transaction
    peran: role
    pemilik: owner
    buat: create
    batalkan: cancel
    batal: cancel
    catat: record
    baca: read
    ubah: update
    hapus: delete
    simpan: save
    kirim: send
    setujui: approve
    tolak: reject
    ditolak: rejected
    tinjau: review
    periksa: check
    cek: check
    cabut: revoke
    aktifkan: activate
    aktivasi: activation
    nonaktifkan: deactivate
    validasi: validation
    hitung: count
    kebutuhan: requirement
    konfigurasi: configuration
    pengendalian: control

query:
  drop_ids: true            # remove BPMN trace ids like SAL-SO-001 from query text
  weights:                  # weight of each query part role (see query/builder.py)
    name: 1.0
    name_old: 1.0
    documentation: 0.5
    flow: 0.3
    flow_endpoint: 0.3
    lane: 0.2
    process: 0.1
    task_context: 0.3       # names of predecessor/successor nodes of a changed task (PIC suggestion)
  task_context_flow_types: [sequenceFlow]   # flows followed to find a task's neighbours

retrieval:
  method: bm25              # bm25 | keyword | tfidf
  top_k: 10
  bm25:
    k1: 1.5
    b: 0.75
  tfidf:
    sublinear_tf: true
  # Multiplier applied per document field (BM25 only)
  field_weights:
    path: 2.0
    name: 3.0
    route: 2.0
    db_table: 2.0
    comment: 1.0
    config: 1.0
    test: 2.0
    body: 1.0

evaluation:
  k_values: [1, 3, 5, 10]
  match_level: file         # file | function (default view on the website)
  retrieve_depth: 100       # documents retrieved before collapsing to files
  # Dev set: experiments and tuning. Test set: frozen on 2026-11-04, evaluated once at M4
  # with the final config. Do not tune on it. `all` = every scenario folder.
  splits:
    dev: [S01, S02, S03, S04, S05, S06]
    test: [S07, S08, S09, S10]
  default_split: dev        # used by experiments/run_eval.py and the website
